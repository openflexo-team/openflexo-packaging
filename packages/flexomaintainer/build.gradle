dependencies {
    runtimeOnly project(':packages:openflexo-designer')
    //runtimeOnly flexoDocResourceCenter()
    runtimeOnly restConnector()
    runtimeOnly restConnectorUi()
    //runtimeOnly markdownConnector()
    //runtimeOnly markdownConnectorUi()
    runtimeOnly oslcConnector()
    runtimeOnly oslcConnectorUi()
    runtimeOnly jsonConnector()
    runtimeOnly jsonConnectorUi()
    runtimeOnly xxConnector()
    runtimeOnly xxConnectorUi()
    runtimeOnly dslConnector()
    runtimeOnly dslConnectorUi()
    runtimeOnly rhapsodyConnector()
    runtimeOnly rhapsodyConnectorUi()
}
apply plugin: 'application'
application {
    mainClass = "org.openflexo.Flexo"
}

// ./gradlew :packages:flexomaintainer:jpackage builds the native installer of the platform (see the buildplugin)
jpackage {
    appName = 'Openflexo FlexoMaintainer'
    description = 'Flexo Maintainer - all the Openflexo modules, for integration'
    iconMac = file('src/main/resources/Icons/IconOpenflexo.icns')
    iconWindows = file('src/main/resources/Icons/Openflexo.ico')
}
