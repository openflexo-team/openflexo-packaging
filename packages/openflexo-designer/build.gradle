dependencies {

	// modules
    runtimeOnly openflexoModule("om-module")
    runtimeOnly openflexoModule("fme-module")
    runtimeOnly openflexoModule("ea-module")
 
 	// technology adapters
    runtimeOnly diagramConnector()
    runtimeOnly diagramConnectorUi()
    runtimeOnly emfConnector()
    runtimeOnly emfConnectorUi()
    runtimeOnly xmlConnector()
    runtimeOnly xmlConnectorUi()
    runtimeOnly owlConnector()
    runtimeOnly owlConnectorUi()
    runtimeOnly excelConnector()
    runtimeOnly excelConnectorUi()
    runtimeOnly powerpointConnector()
    runtimeOnly powerpointConnectorUi()
    runtimeOnly docxConnector()
    runtimeOnly docxConnectorUi()
    runtimeOnly odtConnector()
    runtimeOnly odtConnectorUi()
    runtimeOnly pdfConnector()
    runtimeOnly pdfConnectorUi()
    runtimeOnly ginaConnector()
    runtimeOnly ginaConnectorUi()
    runtimeOnly jdbcConnector()
    runtimeOnly jdbcConnectorUi()
    //runtimeOnly httpConnector()
    //runtimeOnly httpConnectorUi()
    //runtimeOnly httpConnectorRc()
    runtimeOnly kafkaConnector()
    runtimeOnly kafkaConnectorUi()
    runtimeOnly javaConnector()
    runtimeOnly javaConnectorUi()
    runtimeOnly opcUaConnector()
    runtimeOnly opcUaConnectorUi()
    //runtimeOnly obp2Connector()
    //runtimeOnly obp2ConnectorRc()
    //runtimeOnly obp2ConnectorUi()
    //runtimeOnly flexoDocResourceCenter()

}

apply plugin: 'application'
application {
    mainClass = "org.openflexo.Flexo"
}

// ./gradlew :packages:openflexo-designer:jpackage builds the native installer of the platform (see the buildplugin)
jpackage {
    appName = 'Openflexo Designer'
    description = 'Openflexo Designer - tools to design a particular business'
    iconMac = file('src/main/resources/Icons/IconOpenflexo.icns')
    iconWindows = file('src/main/resources/Icons/Openflexo.ico')
}
