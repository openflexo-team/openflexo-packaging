dependencies {
    // embed FML command-line interpreter
    runtimeOnly fmlCli()
    //runtimeOnly openflexoModule("fml-cli")

    // technology adapters
    runtimeOnly diagramConnector()
    runtimeOnly emfConnector()
    runtimeOnly xmlConnector()
    runtimeOnly owlConnector()
    runtimeOnly excelConnector()
    runtimeOnly powerpointConnector()
    runtimeOnly docxConnector()
    runtimeOnly odtConnector()
    runtimeOnly pdfConnector()
    runtimeOnly ginaConnector()
    runtimeOnly jdbcConnector()
    runtimeOnly kafkaConnector()
    //runtimeOnly flexoDocResourceCenter()
}

apply plugin: 'application'
application {
    mainClass = "org.openflexo.foundation.fml.cli.LaunchHeadlessFMLCLI"
}

// ./gradlew :packages:openflexo-headless:jpackage builds the native installer of the platform (see the buildplugin)
jpackage {
    appName = 'Openflexo Headless'
    description = 'Openflexo Headless Environment'
    iconMac = file('src/main/resources/Icons/IconOpenflexo.icns')
    iconWindows = file('src/main/resources/Icons/Openflexo.ico')
    console = true
}
