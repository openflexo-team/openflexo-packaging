# Builds the native installers of the Openflexo applications with jpackage.
# jpackage cannot cross-build: each installer is produced on a runner of its own operating system.
# Run it by hand (Actions tab, "Run workflow"); the installers are attached to the run.
name: Installers

on:
  workflow_dispatch:

jobs:
  installers:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Linux: .deb, macOS: .dmg, Windows: .msi (WiX is installed on the runner). Not signed.
      - name: Build the installers
        shell: bash
        run: >
          ./gradlew
          :packages:openflexo-designer:jpackage
          :packages:flexomaintainer:jpackage
          :packages:freemodelling:jpackage
          :packages:openflexo-headless:jpackage

      # Linux also gets a .rpm (the .deb above is the default type) and the portable archives
      # (jars in lib/, start script in bin/; they need a Java on the machine)
      - name: Build the .rpm and the portable archives
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y rpm
          ./gradlew -Pjpackage.type=rpm \
            :packages:openflexo-designer:jpackage \
            :packages:flexomaintainer:jpackage \
            :packages:freemodelling:jpackage \
            :packages:openflexo-headless:jpackage
          ./gradlew \
            :packages:openflexo-designer:distTar \
            :packages:flexomaintainer:distTar \
            :packages:freemodelling:distTar \
            :packages:openflexo-headless:distTar \
            :packages:openflexo-server-package:distTar

      # The server is not installed: besides its portable archive it is delivered as an application
      # image with its own Java runtime, tarred to keep the execution rights
      - name: Build the server image
        if: runner.os == 'Linux'
        run: |
          ./gradlew :packages:openflexo-server-package:jpackage
          tar czf packages/openflexo-server-package/build/openflexo-server-linux-image.tar.gz \
            -C packages/openflexo-server-package/build/jpackage/dist/app-image openflexo-server

      # Docker image of the server, built from its portable archive and checked by starting it.
      # It is not pushed anywhere.
      - name: Build and check the server Docker image
        if: runner.os == 'Linux'
        run: |
          mkdir docker-context
          tar xzf packages/openflexo-server-package/build/distributions/*.tar.gz -C docker-context --strip-components=1
          docker build -f packages/openflexo-server-package/Dockerfile -t openflexo-server:test docker-context
          docker run -d --name server -p 9090:9090 openflexo-server:test
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://localhost:9090/ && echo "server is up" && exit 0
            sleep 2
          done
          docker logs server
          exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ runner.os }}
          path: |
            packages/*/build/jpackage/dist/*/*
            packages/*/build/distributions/*.tar.gz
            packages/openflexo-server-package/build/openflexo-server-linux-image.tar.gz
            !packages/openflexo-server-package/build/jpackage/**
          if-no-files-found: error
